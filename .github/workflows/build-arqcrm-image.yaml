name: Build arqcrm image

# Constrói a imagem do Twenty com as nossas modificações e publica no GHCR.
#
# Por que existe: o build do `twenty-front` roda com
# NODE_OPTIONS=--max-old-space-size=8192, ou seja pede 8 GB. A VPS onde o
# produto roda tem 43 containers de produção e ~9 GB livres — um build lá
# arriscaria OOM e derrubaria serviço no ar. O runner do GitHub tem 16 GB e é
# descartável, então é o lugar certo.
#
# A VPS só faz `docker pull`.

on:
  push:
    branches:
      - arqcrm/main
    paths-ignore:
      - '**.md'
      - 'packages/twenty-website/**'
      - 'packages/twenty-docs/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag extra para a imagem (além do sha)'
        required: false
        default: ''

concurrency:
  # Um build por branch. Push novo cancela o anterior — o build é longo e o
  # resultado do commit antigo não interessa.
  group: build-arqcrm-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Espaço em disco disponível
        # O build do monorepo é grande; o runner vem com ~14 GB livres e isso
        # às vezes não basta. Liberar antes é mais barato que descobrir no fim.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/arqcrm/main' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          # `twenty` = server + frontend no mesmo container. É o que permite
          # servir o SPA e a API na mesma origem, sem CORS, enquanto a
          # separação front/back não for feita.
          target: twenty
          # A VPS é amd64. Construir arm64 junto dobraria o tempo por nada.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          echo "### Imagem publicada" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Para atualizar a VPS:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker service update --image ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }} arqcrm_server" >> $GITHUB_STEP_SUMMARY
          echo "docker service update --image ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }} arqcrm_worker" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
